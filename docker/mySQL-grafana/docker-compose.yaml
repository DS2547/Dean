version: '3.8'

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: blank
      MYSQL_DATABASE: mydb
      MYSQL_USER: DUser
      MYSQL_PASSWORD: DPass
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - app-network
    depends_on:
      - mysql

volumes:
  mysql_data:
  grafana_data:

networks:
  app-network:
    driver: bridge